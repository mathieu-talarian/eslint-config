approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.0.cjs

packageExtensions:
  # turbo is only needed by consumers who actually lint turbo.json; this
  # package only re-exports the plugin config, so the peer is optional here.
  eslint-plugin-turbo@*:
    peerDependenciesMeta:
      turbo:
        optional: true
